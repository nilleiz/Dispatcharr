name: Stable XMLTV Episode Date Compatibility Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stable-xmltv-original-air-date.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/stable-xmltv-original-air-date.yml'
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even if this stable/feature candidate already exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: stable-xmltv-date-episode-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork maintenance files
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve latest stable release and candidate
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
          FEATURE_REPOSITORY: nilleiz/Dispatcharr
          FEATURE_REF: feature/epg-air-date-compatibility
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api repos/Dispatcharr/Dispatcharr/releases/latest)"
          UPSTREAM_TAG="$(jq -r '.tag_name' <<<"$RELEASE_JSON")"
          DRAFT="$(jq -r '.draft' <<<"$RELEASE_JSON")"
          PRERELEASE="$(jq -r '.prerelease' <<<"$RELEASE_JSON")"
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "Latest stable release did not provide a tag"
            exit 1
          fi
          if [ "$DRAFT" != "false" ] || [ "$PRERELEASE" != "false" ]; then
            echo "Latest release is not a stable non-draft release"
            exit 1
          fi

          FEATURE_SHA="$(
            git ls-remote "https://github.com/${FEATURE_REPOSITORY}.git" \
              "refs/heads/${FEATURE_REF}" | awk 'NR == 1 { print $1 }'
          )"
          if ! grep -Eq '^[0-9a-f]{40}$' <<<"$FEATURE_SHA"; then
            echo "Could not resolve ${FEATURE_REPOSITORY}:${FEATURE_REF}"
            exit 1
          fi

          FEATURE_SHORT_SHA="${FEATURE_SHA:0:12}"
          CANDIDATE_TAG="candidate-${UPSTREAM_TAG}-${FEATURE_SHORT_SHA}"
          CANDIDATE_URL="https://hub.docker.com/v2/repositories/nillivanilli0815/dispatcharr-xmltv-original-air-date/tags/${CANDIDATE_TAG}/"
          CANDIDATE_EXISTS=false
          if curl --fail --silent --show-error "$CANDIDATE_URL" >/dev/null; then
            CANDIDATE_EXISTS=true
          fi
          SHOULD_PUBLISH=true
          if [ "$CANDIDATE_EXISTS" = "true" ] && [ "$FORCE_REBUILD" != "true" ]; then
            SHOULD_PUBLISH=false
          fi

          echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "feature_sha=$FEATURE_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "candidate_exists=$CANDIDATE_EXISTS" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Checkout exact upstream stable tag
        uses: actions/checkout@v6
        with:
          repository: Dispatcharr/Dispatcharr
          ref: ${{ steps.release.outputs.tag }}
          path: upstream-src
          fetch-depth: 0

      - name: Integrate exact XMLTV compatibility feature commit
        id: integration
        env:
          FEATURE_SHA: ${{ steps.release.outputs.feature_sha }}
          FEATURE_REF: feature/epg-air-date-compatibility
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-src describe --tags --exact-match

          git -C upstream-src fetch --no-tags \
            https://github.com/nilleiz/Dispatcharr.git \
            "refs/heads/${FEATURE_REF}"
          FETCHED_SHA="$(git -C upstream-src rev-parse FETCH_HEAD)"
          test "$FETCHED_SHA" = "$FEATURE_SHA"

          FEATURE_PARENT="$(git -C upstream-src rev-parse "${FEATURE_SHA}^")"
          PATCH_STATE="$(
            git -C upstream-src cherry HEAD "$FEATURE_SHA" "$FEATURE_PARENT"
          )"
          case "$PATCH_STATE" in
            ""|"- $FEATURE_SHA")
              echo "Feature patch is already present upstream"
              echo "source=upstream" >> "$GITHUB_OUTPUT"
              ;;
            "+ $FEATURE_SHA")
              if ! git -C upstream-src cherry-pick --no-commit "$FEATURE_SHA"; then
                echo "::error::The XMLTV compatibility feature no longer applies cleanly to ${{ steps.release.outputs.tag }}. Rebase feature/epg-air-date-compatibility onto current upstream/dev."
                exit 1
              fi
              echo "source=feature-commit" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected patch-equivalence result: $PATCH_STATE"
              exit 1
              ;;
          esac
          git -C upstream-src diff --check

      - name: Run focused backend tests
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/dispatcharr/dispatcharr:base
          docker run --rm --entrypoint "" \
            -v "${GITHUB_WORKSPACE}/upstream-src:/work" \
            -w /work \
            -e GITHUB_WORKSPACE=/work \
            -e DISPATCHARR_ENV=aio \
            -e DJANGO_SECRET_KEY=ci-test-secret-key \
            -e POSTGRES_DB=dispatcharr \
            -e POSTGRES_USER=dispatch \
            -e POSTGRES_PASSWORD=secret \
            -e DISPATCHARR_LOG_LEVEL=WARNING \
            ghcr.io/dispatcharr/dispatcharr:base \
            bash scripts/ci_bootstrap_backend.sh \
              apps.epg.tests.test_extract_custom_properties \
              apps.epg.tests.test_serializers \
              apps.output.tests.test_views.OutputEPGXMLEscapingTest \
              core.tests.test_core.DateEpisodeCompatibilityTest -v2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: upstream-src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: upstream-src/frontend
        run: npm ci

      - name: Lint changed frontend files
        working-directory: upstream-src/frontend
        run: >-
          npx eslint
          src/components/forms/settings/SystemSettingsForm.jsx
          src/components/tables/ChannelsTable.jsx
          src/components/forms/settings/__tests__/SystemSettingsDateEpisodeCompatibility.test.jsx
          src/utils/forms/settings/SystemSettingsFormUtils.js
          src/utils/forms/settings/__tests__/SystemSettingsFormUtils.test.js
          src/utils/pages/SettingsUtils.js
          src/utils/pages/__tests__/SettingsUtils.test.js
          src/utils/tables/ChannelsTableUtils.js
          src/utils/tables/__tests__/ChannelsTableUtils.test.js

      - name: Check changed frontend formatting
        working-directory: upstream-src/frontend
        run: >-
          npx prettier --check
          src/components/forms/settings/SystemSettingsForm.jsx
          src/components/tables/ChannelsTable.jsx
          src/components/forms/settings/__tests__/SystemSettingsDateEpisodeCompatibility.test.jsx
          src/utils/forms/settings/SystemSettingsFormUtils.js
          src/utils/forms/settings/__tests__/SystemSettingsFormUtils.test.js
          src/utils/pages/SettingsUtils.js
          src/utils/pages/__tests__/SettingsUtils.test.js
          src/utils/tables/ChannelsTableUtils.js
          src/utils/tables/__tests__/ChannelsTableUtils.test.js

      - name: Run focused frontend tests
        working-directory: upstream-src/frontend
        run: >-
          npm test --
          src/components/forms/settings/__tests__/SystemSettingsDateEpisodeCompatibility.test.jsx
          src/utils/forms/settings/__tests__/SystemSettingsFormUtils.test.js
          src/utils/pages/__tests__/SettingsUtils.test.js
          src/utils/tables/__tests__/ChannelsTableUtils.test.js

      - name: Set up QEMU
        if: github.event_name != 'pull_request' && steps.release.outputs.should_publish == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request' || steps.release.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Verify Docker Hub credentials
        if: github.event_name != 'pull_request' && steps.release.outputs.should_publish == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DOCKERHUB_USERNAME" = "nillivanilli0815"
          test -n "$DOCKERHUB_TOKEN"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.release.outputs.should_publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Select Docker tags
        if: github.event_name != 'pull_request' && steps.release.outputs.should_publish == 'true'
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'value<<EOF'
            echo 'docker.io/nillivanilli0815/dispatcharr-xmltv-original-air-date:latest'
            echo "docker.io/nillivanilli0815/dispatcharr-xmltv-original-air-date:${{ steps.release.outputs.tag }}"
            echo "docker.io/nillivanilli0815/dispatcharr-xmltv-original-air-date:${{ steps.release.outputs.candidate_tag }}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and optionally publish stable image
        if: github.event_name == 'pull_request' || steps.release.outputs.should_publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: upstream-src
          file: upstream-src/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ github.event_name == 'pull_request' && 'dispatcharr-xmltv-original-air-date:validation' || steps.tags.outputs.value }}
          build-args: |
            REPO_OWNER=dispatcharr
            REPO_NAME=dispatcharr
            BASE_TAG=base
            BRANCH=${{ steps.release.outputs.tag }}
            REPO_URL=https://github.com/Dispatcharr/Dispatcharr
          cache-from: type=gha,scope=xmltv-date-episode-compatibility
          cache-to: type=gha,mode=max,scope=xmltv-date-episode-compatibility

      - name: Verify candidate multi-arch manifest
        if: github.event_name != 'pull_request' && steps.release.outputs.should_publish == 'true'
        env:
          CANDIDATE_TAG: ${{ steps.release.outputs.candidate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_URL="https://hub.docker.com/v2/repositories/nillivanilli0815/dispatcharr-xmltv-original-air-date/tags/${CANDIDATE_TAG}"
          for attempt in $(seq 1 30); do
            if MANIFEST_JSON="$(curl --fail --silent --show-error "$TAG_URL")"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Candidate tag did not become available: ${CANDIDATE_TAG}"
              exit 1
            fi
            sleep 20
          done
          ARCHES="$(jq -r '.images[] | select(.os == "linux") | .architecture' <<<"$MANIFEST_JSON" | sort -u)"
          grep -qx 'amd64' <<<"$ARCHES"
          grep -qx 'arm64' <<<"$ARCHES"
