name: Stable Original Air Date Image

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild the current stable release even if its candidate tag exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: stable-original-air-date-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork maintenance files
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve latest stable release and feature revision
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api repos/Dispatcharr/Dispatcharr/releases/latest)"
          UPSTREAM_TAG="$(jq -r '.tag_name' <<<"$RELEASE_JSON")"
          DRAFT="$(jq -r '.draft' <<<"$RELEASE_JSON")"
          PRERELEASE="$(jq -r '.prerelease' <<<"$RELEASE_JSON")"
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "Latest stable release did not provide a tag"
            exit 1
          fi
          if [ "$DRAFT" != "false" ] || [ "$PRERELEASE" != "false" ]; then
            echo "Latest release is not a stable non-draft release"
            exit 1
          fi

          FEATURE_SHA="$(gh api             "repos/${GITHUB_REPOSITORY}/commits/feature/dvr-original-air-date"             --jq '.sha')"
          SHORT_FEATURE_SHA="${FEATURE_SHA:0:12}"
          CANDIDATE_TAG="candidate-${UPSTREAM_TAG}-${SHORT_FEATURE_SHA}"
          CANDIDATE_URL="https://hub.docker.com/v2/repositories/nillivanilli0815/dispatcharr-original-air-date/tags/${CANDIDATE_TAG}/"

          CANDIDATE_EXISTS=false
          if curl --fail --silent --show-error "$CANDIDATE_URL" >/dev/null; then
            CANDIDATE_EXISTS=true
          fi

          SHOULD_BUILD=true
          if [ "$CANDIDATE_EXISTS" = "true" ] && [ "$FORCE_REBUILD" != "true" ]; then
            SHOULD_BUILD=false
          fi

          echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "feature_sha=$FEATURE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_feature_sha=$SHORT_FEATURE_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "candidate_exists=$CANDIDATE_EXISTS" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream stable tag $UPSTREAM_TAG and feature $SHORT_FEATURE_SHA"
          echo "Candidate exists: $CANDIDATE_EXISTS; build requested: $SHOULD_BUILD"

      - name: Checkout exact upstream stable tag
        if: steps.release.outputs.should_build == 'true'
        uses: actions/checkout@v6
        with:
          repository: Dispatcharr/Dispatcharr
          ref: ${{ steps.release.outputs.tag }}
          path: upstream-src
          fetch-depth: 1

      - name: Verify and apply stable feature patch
        if: steps.release.outputs.should_build == 'true'
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-src describe --tags --exact-match
          git -C upstream-src apply --check ../patches/dvr-original-air-date.patch
          git -C upstream-src apply ../patches/dvr-original-air-date.patch
          git -C upstream-src diff --check

      - name: Run focused backend tests
        if: steps.release.outputs.should_build == 'true'
        id: backend
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/dispatcharr/dispatcharr:base
          docker run --rm --entrypoint ""             -v "${GITHUB_WORKSPACE}/upstream-src:/work"             -w /work             -e GITHUB_WORKSPACE=/work             -e DISPATCHARR_ENV=aio             -e DJANGO_SECRET_KEY=ci-test-secret-key             -e POSTGRES_DB=dispatcharr             -e POSTGRES_USER=dispatch             -e POSTGRES_PASSWORD=secret             -e DISPATCHARR_LOG_LEVEL=WARNING             ghcr.io/dispatcharr/dispatcharr:base             bash scripts/ci_bootstrap_backend.sh             apps.channels.tests.test_recording_pipeline             apps.channels.tests.test_series_rule_dedup -v2

      - name: Set up Node.js
        if: steps.release.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: upstream-src/frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.release.outputs.should_build == 'true'
        working-directory: upstream-src/frontend
        run: npm ci

      - name: Lint changed frontend files
        if: steps.release.outputs.should_build == 'true'
        id: frontend_lint
        working-directory: upstream-src/frontend
        run: >-
          npx eslint
          src/components/forms/settings/DvrSettingsForm.jsx
          src/components/forms/settings/__tests__/DvrSettingsForm.test.jsx

      - name: Check changed frontend formatting
        if: steps.release.outputs.should_build == 'true'
        id: frontend_format
        working-directory: upstream-src/frontend
        run: >-
          npx prettier --check
          src/components/forms/settings/DvrSettingsForm.jsx
          src/components/forms/settings/__tests__/DvrSettingsForm.test.jsx

      - name: Run focused frontend tests
        if: steps.release.outputs.should_build == 'true'
        id: frontend_test
        working-directory: upstream-src/frontend
        run: >-
          npm test --
          src/components/forms/settings/__tests__/DvrSettingsForm.test.jsx

      - name: Build frontend
        if: steps.release.outputs.should_build == 'true'
        id: frontend_build
        working-directory: upstream-src/frontend
        run: npm run build

      - name: Verify Docker Hub credentials are configured
        if: steps.release.outputs.should_build == 'true'
        id: credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Missing required GitHub Actions secret: DOCKERHUB_USERNAME"
            exit 1
          fi
          if [ "$DOCKERHUB_USERNAME" != "nillivanilli0815" ]; then
            echo "DOCKERHUB_USERNAME is configured for the wrong Docker Hub account"
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing required GitHub Actions secret: DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Set up QEMU
        if: steps.release.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.release.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.release.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Select Docker tags
        if: steps.release.outputs.should_build == 'true'
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'value<<EOF'
            echo 'docker.io/nillivanilli0815/dispatcharr-original-air-date:latest'
            echo "docker.io/nillivanilli0815/dispatcharr-original-air-date:${{ steps.release.outputs.tag }}"
            if [ "${{ steps.release.outputs.candidate_exists }}" != "true" ]; then
              echo "docker.io/nillivanilli0815/dispatcharr-original-air-date:${{ steps.release.outputs.candidate_tag }}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish stable multi-arch image
        if: steps.release.outputs.should_build == 'true'
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: upstream-src
          file: upstream-src/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            REPO_OWNER=dispatcharr
            REPO_NAME=dispatcharr
            BASE_TAG=base
            BRANCH=${{ steps.release.outputs.tag }}
            REPO_URL=https://github.com/Dispatcharr/Dispatcharr
          cache-from: type=gha,scope=stable-original-air-date
          cache-to: type=gha,mode=max,scope=stable-original-air-date

      - name: Verify candidate multi-arch manifest
        id: manifest
        if: steps.release.outputs.candidate_tag != ''
        env:
          CANDIDATE_TAG: ${{ steps.release.outputs.candidate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_URL="https://hub.docker.com/v2/repositories/nillivanilli0815/dispatcharr-original-air-date/tags/${CANDIDATE_TAG}"
          MANIFEST_JSON=""
          for attempt in $(seq 1 30); do
            if MANIFEST_JSON="$(curl --fail --silent --show-error "$TAG_URL")"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::Candidate tag did not become available: ${CANDIDATE_TAG}"
              exit 1
            fi
            sleep 20
          done
          ARCHES="$(jq -r '.images[] | select(.os == "linux") | .architecture' <<<"$MANIFEST_JSON" | sort -u)"
          grep -qx 'amd64' <<<"$ARCHES"
          grep -qx 'arm64' <<<"$ARCHES"
          echo "Verified ${CANDIDATE_TAG} for linux/amd64 and linux/arm64."

      - name: Create or update fork failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
          CANDIDATE_TAG: ${{ steps.release.outputs.candidate_tag }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          FRONTEND_LINT_OUTCOME: ${{ steps.frontend_lint.outcome }}
          FRONTEND_FORMAT_OUTCOME: ${{ steps.frontend_format.outcome }}
          FRONTEND_TEST_OUTCOME: ${{ steps.frontend_test.outcome }}
          FRONTEND_BUILD_OUTCOME: ${{ steps.frontend_build.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          DOCKER_OUTCOME: ${{ steps.docker.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="[automation] Stable DVR original-air image build failed"
          BODY="$(printf '%s\n'             "The fork-only stable image workflow failed safely; no unverified image was published."             ""             "- Upstream stable tag: \`${UPSTREAM_TAG:-unresolved}\`"             "- Candidate tag: \`${CANDIDATE_TAG:-unresolved}\`"             "- Patch step: \`${PATCH_OUTCOME:-not-run}\`"             "- Backend tests: \`${BACKEND_OUTCOME:-not-run}\`"             "- Frontend lint: \`${FRONTEND_LINT_OUTCOME:-not-run}\`"             "- Frontend format: \`${FRONTEND_FORMAT_OUTCOME:-not-run}\`"             "- Frontend tests: \`${FRONTEND_TEST_OUTCOME:-not-run}\`"             "- Frontend build: \`${FRONTEND_BUILD_OUTCOME:-not-run}\`"             "- Docker Hub credentials: \`${CREDENTIALS_OUTCOME:-not-run}\`"             "- Docker publish: \`${DOCKER_OUTCOME:-not-run}\`"             "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          ISSUE_NUMBER="$(gh issue list             --repo "$GITHUB_REPOSITORY"             --state open             --search "$TITLE in:title"             --json number             --jq '.[0].number // empty')"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER"               --repo "$GITHUB_REPOSITORY"               --body "$BODY"
          else
            gh issue create               --repo "$GITHUB_REPOSITORY"               --title "$TITLE"               --body "$BODY"
          fi

      - name: Close resolved fork failure issue
        if: steps.release.outputs.should_build == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="[automation] Stable DVR original-air image build failed"
          ISSUE_NUMBER="$(gh issue list             --repo "$GITHUB_REPOSITORY"             --state open             --search "$TITLE in:title"             --json number             --jq '.[0].number // empty')"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER"               --repo "$GITHUB_REPOSITORY"               --comment "Resolved by workflow run https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi


      - name: Create or update fork publication status
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
          CANDIDATE_TAG: ${{ steps.release.outputs.candidate_tag }}
          CANDIDATE_EXISTS: ${{ steps.release.outputs.candidate_exists }}
          SHOULD_BUILD: ${{ steps.release.outputs.should_build }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="[automation] Stable DVR original-air image publication"
          BODY="$(printf '%s\n'             "Fork-only Docker publication status."             ""             "- Upstream stable tag: \`${UPSTREAM_TAG}\`"             "- Candidate tag: \`${CANDIDATE_TAG}\`"             "- Candidate already existed at start: \`${CANDIDATE_EXISTS}\`"             "- Built during this run: \`${SHOULD_BUILD}\`"             "- Manifest: \`linux/amd64, linux/arm64\`"             "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          ISSUE_NUMBER="$(gh issue list             --repo "$GITHUB_REPOSITORY"             --state open             --search "$TITLE in:title"             --json number             --jq '.[0].number // empty')"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER"               --repo "$GITHUB_REPOSITORY"               --body "$BODY"
          else
            gh issue create               --repo "$GITHUB_REPOSITORY"               --title "$TITLE"               --body "$BODY"
          fi
